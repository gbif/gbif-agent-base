version: '3'

silent: false

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build base and backend images
    deps:
      - backend

  base:
    desc: Build CLI and shared tooling image
    cmds:
      - podman build -f Containerfile.base -t localhost/agent-base:latest .

  backend:
    desc: Build backend image (depends on base)
    deps:
      - base
    cmds:
      - podman build -f Containerfile.backend -t localhost/agent-backend:latest .

  install:
    desc: Install launcher into ~/.local/bin (or INSTALL_DIR)
    cmds:
      - bash ./install.sh

  images:
    desc: Show locally built agent images
    cmds:
      - podman images --filter reference=localhost/agent-*
