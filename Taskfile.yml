version: '3'

silent: false

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build base and shared development images
    deps:
      - dev

  base:
    desc: Refresh the Node base, CA certificates, and agent CLIs
    cmds:
      - podman build --pull=always --no-cache -f Containerfile.base -t localhost/agent-base:latest .

  dev:
    desc: Build shared development image (depends on base)
    deps:
      - base
    cmds:
      - podman build -f Containerfile.dev -t localhost/agent-dev:latest .

  backend:
    desc: Build compatibility backend tag (depends on dev)
    deps:
      - dev
    cmds:
      - podman build -f Containerfile.backend -t localhost/agent-backend:latest .

  install:
    desc: Install launcher into ~/.local/bin (or INSTALL_DIR)
    cmds:
      - bash ./install.sh

  smoke:
    desc: Check development tools as an unprivileged user with a fresh home
    cmds:
      - podman run --rm --user 1000:1000 --env HOME=/tmp/agent-smoke --cap-drop=ALL --security-opt=no-new-privileges --mount type=bind,source={{.TASKFILE_DIR}}/scripts/smoke-dev.sh,destination=/tmp/smoke-dev.sh,ro localhost/agent-dev:latest bash /tmp/smoke-dev.sh

  images:
    desc: Show locally built agent images
    cmds:
      - podman images --filter reference=localhost/agent-*

  vpn-test:
    desc: Compare host and container HTTP access to a VPN-only endpoint
    cmds:
      - bash ./vpn-test.sh

  backup:
    desc: Back up existing agent volumes to a new local directory
    env:
      BACKUP_DIR: '{{.BACKUP_DIR}}'
      PODMAN_CONNECTION: '{{.PODMAN_CONNECTION}}'
    cmds:
      - bash ./scripts/volume-backup.sh backup

  restore:
    desc: Restore agent volumes from BACKUP_DIR when all target names are absent
    env:
      BACKUP_DIR: '{{.BACKUP_DIR}}'
      PODMAN_CONNECTION: '{{.PODMAN_CONNECTION}}'
    cmds:
      - bash ./scripts/volume-backup.sh restore
